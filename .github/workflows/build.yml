name: Build wheels

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      sha:
        description: "Commit SHA to build and release (defaults to the triggering commit)"
        required: false
        type: string
        default: ""
      version:
        description: "Expected wrapper version; the publish job fails if pyproject.toml at the SHA differs"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to build and release (defaults to the head of the selected ref)"
        required: false
        type: string
        default: ""
      version:
        description: "Expected wrapper version (e.g. 0.17.0.1); the publish job fails if pyproject.toml at the SHA differs"
        required: false
        type: string
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          submodules: recursive

      - name: Resolve commit, tag and version
        id: resolve
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # The commit is built exactly as checked out: pyproject.toml and the
          # submodule pointer are never rewritten in the runner.
          SHA=$(git rev-parse HEAD)
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pyproject.toml at $SHA"
            exit 1
          fi
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$VERSION" ]; then
            echo "::error::Requested version $EXPECTED_VERSION differs from pyproject.toml version $VERSION at $SHA"
            exit 1
          fi

          # The submodule must sit on the upstream tag matching X.Y.Z of X.Y.Z.P
          UPSTREAM_TAG="v${VERSION%.*}"
          git -C upstream-quickjs fetch --tags origin
          if ! git -C upstream-quickjs tag --points-at HEAD | grep -qx "$UPSTREAM_TAG"; then
            echo "::error::upstream-quickjs at $SHA is not at tag $UPSTREAM_TAG (version $VERSION)"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

          # A push to main whose version is already on PyPI is a no-op here:
          # main.yml tests every push, so skip the wheel builds and publish.
          BUILD=true
          if [ "$EVENT_NAME" = "push" ]; then
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/quickjs-ng/$VERSION/json")
            case "$STATUS" in
              200)
                BUILD=false
                TAG_SHA=$(git ls-remote origin "refs/tags/v$VERSION^{}" "refs/tags/v$VERSION" | awk 'NR==1{print $1}')
                if [ -n "$TAG_SHA" ]; then
                  echo "::notice::quickjs-ng $VERSION is already on PyPI (tag v$VERSION points at $TAG_SHA); skipping build, upload and tag"
                else
                  echo "::warning::quickjs-ng $VERSION is on PyPI but tag v$VERSION does not exist; skipping build, upload and tag"
                fi ;;
              404) ;;
              *) echo "::error::Unexpected HTTP status $STATUS from PyPI"; exit 1 ;;
            esac
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $SHA: version $VERSION, upstream $UPSTREAM_TAG"

  build-sdist:
    needs: setup
    if: needs.setup.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    needs: setup
    if: needs.setup.outputs.build == 'true'
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cibw_archs: x86_64
          - os: ubuntu-latest
            arch: i686
            cibw_archs: i686
            cibw_manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            arch: aarch64
            cibw_archs: aarch64
            cibw_manylinux_image: manylinux_2_28
          - os: windows-latest
            arch: x86_64
            cibw_archs: AMD64
          - os: windows-latest
            arch: i686
            cibw_archs: x86
          - os: macos-14
            arch: arm64
            cibw_archs: arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
          submodules: recursive

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_MANYLINUX_I686_IMAGE: ${{ matrix.cibw_manylinux_image && format('quay.io/pypa/{0}_i686', matrix.cibw_manylinux_image) || '' }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.cibw_manylinux_image && format('quay.io/pypa/{0}_aarch64', matrix.cibw_manylinux_image) || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  publish:
    needs: [setup, build-sdist, build-wheels]
    if: needs.setup.outputs.publish == 'true' && needs.setup.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      SHA: ${{ needs.setup.outputs.sha }}
      VERSION: ${{ needs.setup.outputs.version }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify version before upload
        run: |
          PYPROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "$PYPROJECT_VERSION" != "$VERSION" ]; then
            echo "::error::Release version $VERSION differs from pyproject.toml version $PYPROJECT_VERSION at $SHA"
            exit 1
          fi
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Requested version $EXPECTED_VERSION differs from pyproject.toml version $PYPROJECT_VERSION at $SHA"
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib, sys
          version = os.environ["VERSION"]
          files = sorted(p for p in pathlib.Path("dist").iterdir() if p.is_file())
          if not files:
              sys.exit("No distributions to publish")
          bad = []
          for p in files:
              if p.name.endswith(".whl"):
                  found = p.name.split("-")[1]
              elif p.name.endswith(".tar.gz"):
                  found = p.name[: -len(".tar.gz")].rsplit("-", 1)[1]
              else:
                  bad.append(f"{p.name}: unexpected file type")
                  continue
              if found != version:
                  bad.append(f"{p.name}: version {found} != {version}")
          if bad:
              sys.exit("Distribution version mismatch:\n" + "\n".join(bad))
          print(f"{len(files)} distributions all at version {version}")
          PY

      - name: Check if version is already on PyPI
        id: pypi
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/quickjs-ng/$VERSION/json")
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT"; echo "::notice::quickjs-ng $VERSION is already on PyPI, skipping upload" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected HTTP status $STATUS from PyPI"; exit 1 ;;
          esac

      - name: Publish to PyPI
        id: upload
        if: steps.pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create and push tag
        if: steps.upload.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "$TAG^{commit}")" = "$SHA" ]; then
              echo "Tag $TAG already points at $SHA, skipping."
            else
              echo "::error::Tag $TAG already exists at a different commit"
              exit 1
            fi
          else
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Note already published version
        if: steps.pypi.outputs.exists == 'true'
        run: |
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::Tag $TAG already points at $(git rev-parse "$TAG^{commit}"); not re-tagging"
          else
            echo "::warning::$VERSION is on PyPI but tag $TAG does not exist; tag the released commit manually if needed"
          fi
