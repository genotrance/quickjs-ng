name: Check Python support window

on:
  schedule:
    # Compare classifiers with the pinned cibuildwheel monthly from the default (devel) branch.
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the cibuildwheel version pinned in build.yml
        run: |
          VERSION=$(sed -nE 's#.*pypa/cibuildwheel@v([0-9][0-9.]*).*#\1#p' .github/workflows/build.yml | head -n1)
          test -n "$VERSION"
          echo "Pinned cibuildwheel: $VERSION"
          python -m pip install "cibuildwheel==$VERSION"

      - name: Compare classifiers with what cibuildwheel builds
        id: support
        env:
          CIBW_BUILD: "*"
          CIBW_ENABLE: cpython-prerelease pypy pypy-eol
          CIBW_PLATFORM: linux
        run: |
          cibuildwheel --print-build-identifiers > ids.txt
          python .github/scripts/check_python_support.py ids.txt

      - name: Open or update a support-drift issue
        if: steps.support.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Python support drift against pinned cibuildwheel"
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file support-drift-body.md
          else
            gh issue create --title "$TITLE" --body-file support-drift-body.md
          fi
