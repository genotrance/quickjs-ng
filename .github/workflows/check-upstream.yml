name: Check upstream quickjs-ng

on:
  schedule:
    # Check monthly on the 1st at 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      branch: ${{ steps.commit.outputs.branch }}
      version: ${{ steps.commit.outputs.version }}
      update_created: ${{ steps.commit.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: devel
          submodules: recursive
          fetch-depth: 0

      - name: Get latest upstream tag
        id: upstream
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/quickjs-ng/quickjs 'v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "::error::No upstream release tag found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $TAG"

      - name: Get latest released version
        id: released
        run: |
          # Latest release according to git tags (vX.Y.Z.P) ...
          TAG_VER=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          # ... and according to PyPI. The newest of the two wins.
          PYPI_VER=$(curl -fsSL https://pypi.org/pypi/quickjs-ng/json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])' \
            || true)
          RELEASED=$(printf '%s\n' "$TAG_VER" "$PYPI_VER" | sed '/^$/d' | sort -V | tail -1)
          echo "Latest git tag: ${TAG_VER:-none}, latest PyPI: ${PYPI_VER:-none}"
          echo "version=$RELEASED" >> "$GITHUB_OUTPUT"
          echo "base=${RELEASED%.*}" >> "$GITHUB_OUTPUT"

      - name: Check if release needed
        id: check
        env:
          UPSTREAM: ${{ steps.upstream.outputs.version }}
          RELEASED_BASE: ${{ steps.released.outputs.base }}
        run: |
          NEWEST=$(printf '%s\n' "$UPSTREAM" "${RELEASED_BASE:-0.0.0}" | sort -V | tail -1)
          if [ "$UPSTREAM" = "${RELEASED_BASE}" ] || [ "$NEWEST" != "$UPSTREAM" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already released: upstream $UPSTREAM, released base ${RELEASED_BASE:-none}"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Release needed: upstream $UPSTREAM, released base ${RELEASED_BASE:-none}"
          fi

      - name: Create upstream update branch
        id: commit
        if: steps.check.outputs.needed == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="upstream/quickjs-ng-$TAG"
          skip_update() {
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists; no update created"
            skip_update
          fi
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --base devel --head "$BRANCH" --state open --json number --jq 'length')" != 0 ]; then
            echo "An open pull request already uses $BRANCH; no update created"
            skip_update
          fi

          git -C upstream-quickjs fetch --tags origin
          git -C upstream-quickjs checkout --detach "$TAG"
          UPSTREAM_SHA=$(git -C upstream-quickjs rev-parse HEAD)
          CURRENT_UPSTREAM_SHA=$(git rev-parse HEAD:upstream-quickjs)

          CURRENT_VER=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "${CURRENT_VER%.*}" = "$UPSTREAM" ]; then
            # Already bumped (e.g. an earlier run committed but did not release): keep the wrapper patch
            VERSION="$CURRENT_VER"
          else
            VERSION="${UPSTREAM}.1"
          fi

          if [ "$CURRENT_UPSTREAM_SHA" = "$UPSTREAM_SHA" ] && [ "$CURRENT_VER" = "$VERSION" ]; then
            echo "devel already contains $TAG at version $VERSION"
            skip_update
          fi

          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" pyproject.toml
          # Keep uv.lock in sync (CI runs `uv lock --locked`)
          sed -i "/^name = \"quickjs-ng\"\$/{n;s/^version = .*/version = \"$VERSION\"/}" uv.lock

          git add upstream-quickjs pyproject.toml uv.lock
          if git diff --cached --quiet; then
            echo "devel already contains $TAG and version $VERSION"
            skip_update
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update upstream quickjs-ng to $TAG (version $VERSION)"
            git push origin "HEAD:refs/heads/$BRANCH"
            {
              echo "created=true"
              echo "branch=$BRANCH"
              echo "sha=$(git rev-parse HEAD)"
              echo "version=$VERSION"
            } >> "$GITHUB_OUTPUT"
          fi

  open-pull-request:
    needs: check
    if: needs.check.outputs.update_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Open the upstream update pull request
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ needs.check.outputs.branch }}
          VERSION: ${{ needs.check.outputs.version }}
        with:
          script: |
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Update upstream quickjs-ng to ${process.env.BRANCH.replace('upstream/quickjs-ng-', '')} (version ${process.env.VERSION})`,
              head: process.env.BRANCH,
              base: 'devel',
              body: 'Automated upstream update. The full CI workflow was dispatched for this branch.'
            });

  trigger-ci:
    needs: [check, open-pull-request]
    if: needs.check.outputs.update_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger full CI on the pull request branch
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ needs.check.outputs.branch }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'main.yml',
              ref: process.env.BRANCH,
              inputs: {
                full: 'true'
              }
            });
