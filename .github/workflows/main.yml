name: CI

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Full support matrix, from the default (devel) branch.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to test (defaults to the selected ref)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      sha:
        description: "Commit SHA to test (defaults to the calling commit)"
        required: false
        type: string
        default: ""
      full:
        description: "Run the full support matrix instead of the fast one"
        required: false
        type: boolean
        default: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          submodules: recursive

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  select-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - id: select
        name: Select fast or full coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
        run: |
          # In a called workflow github.event_name is the caller's event, so
          # callers request the full matrix through the explicit `full` input.
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ] || [ "$FULL_INPUT" = true ]; then
            MODE=full python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import itertools
          import json
          import os

          rows = []
          for os_name, python_version in itertools.product(
              ("ubuntu-latest", "windows-latest", "macos-latest"),
              ("3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.13t", "3.14t", "3.15t", "pypy3.10", "pypy3.11"),
          ):
              rows.append({"os": os_name, "python-version": python_version, "pytest-args": ""})
          # Native ARM exercises the Linux-aarch64 path which the wheel workflow ships.
          rows.append({"os": "ubuntu-24.04-arm", "python-version": "3.15", "pytest-args": ""})
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          print("mode=" + os.environ["MODE"])
          PY
          else
            MODE=fast python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          rows = [
              {"os": "ubuntu-latest", "python-version": "3.10", "pytest-args": "-m 'not slow'"},
              {"os": "ubuntu-latest", "python-version": "3.15", "pytest-args": "-m 'not slow'"},
              {"os": "ubuntu-latest", "python-version": "3.15t", "pytest-args": "-m 'not slow'"},
              {"os": "ubuntu-latest", "python-version": "pypy3.11", "pytest-args": "-m 'not slow'"},
              {"os": "windows-latest", "python-version": "3.15", "pytest-args": "-m 'not slow'"},
              {"os": "macos-latest", "python-version": "3.15", "pytest-args": "-m 'not slow'"},
              {"os": "ubuntu-24.04-arm", "python-version": "3.15", "pytest-args": "-m 'not slow'"},
          ]
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          print("mode=" + os.environ["MODE"])
          PY
          fi

  tests:
    needs: select-matrix
    name: Test (${{ needs.select-matrix.outputs.mode }}) ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          submodules: recursive

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-sync-args: --no-default-groups --group test

      - name: Run tests
        run: uv run --locked --no-default-groups --group test python -m pytest tests ${{ matrix.pytest-args }} --durations=15 --cov --cov-config=pyproject.toml --cov-report=xml
